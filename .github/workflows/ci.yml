name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Check types and documentation
        run: pnpm typecheck && pnpm docs:check

      - name: Check style
        run: pnpm lint && pnpm format:check

      - name: Check package exports
        run: pnpm --filter prosemirror-inspector run publint

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify browser consumers
        run: pnpm test:browser

      - name: Verify Chrome MCP bridge
        run: pnpm test:chrome-mcp

      - name: Upload browser failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failures
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
