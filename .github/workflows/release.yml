name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    name: Version or publish prosemirror-inspector
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:package

      - name: Test
        run: pnpm --filter prosemirror-inspector run test

      - name: Validate package
        run: pnpm --filter prosemirror-inspector run publint

      # npm trusted publishing: pnpm exchanges the GitHub OIDC token for a
      # short-lived npm token. When that exchange fails pnpm only prints a
      # warning, which `changeset publish` swallows, and npm answers the
      # unauthenticated PUT with a bare 404. Run the exchange here first so a
      # misconfigured trusted publisher fails with npm's actual reason.
      - name: Verify npm trusted publishing
        run: |
          if find .changeset -name '*.md' ! -name 'README.md' | grep -q .; then
            echo "Pending changesets: this run opens the release PR and publishes nothing."
            exit 0
          fi
          id_token=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "::add-mask::$id_token"
          response="$RUNNER_TEMP/npm-oidc.json"
          status=$(curl -sS -o "$response" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $id_token" -H "Content-Length: 0" \
            https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/prosemirror-inspector)
          if [ "$status" != "200" ]; then
            echo "::error title=npm trusted publishing::OIDC token exchange failed (HTTP $status): $(cat "$response")"
            echo "Check the trusted publisher on npmjs.com: owner riccardoperra, repository prosemirror-devtools, workflow release.yml, no environment."
            exit 1
          fi
          rm -f "$response"
          echo "npm accepts this workflow as a trusted publisher for prosemirror-inspector."

      - name: Create release pull request or publish
        uses: changesets/action@v2
        with:
          commit-message: "chore: release prosemirror-inspector"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-title: "chore: release prosemirror-inspector"
          publish-script: pnpm ci:publish
          version-script: pnpm ci:version
        env:
          # Publishing authenticates through npm trusted publishing (OIDC,
          # `id-token: write` above); no npm token secret is needed.
          NPM_CONFIG_PROVENANCE: "true"
